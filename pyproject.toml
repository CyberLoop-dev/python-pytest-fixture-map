[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-pytest-fixture-map"
version = "1.0.0"
description = "Static pytest fixture dependency mapper"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
pytest-fixture-map = "pytest_fixture_map:main"

[tool.setuptools]
py-modules = ["pytest_fixture_map"]
